<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Copy AL | Pro Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; background-color: #09090b; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        #root { height: 100dvh; width: 100%; display: flex; flex-direction: column; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes showBtn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes rotateGradient { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-9px); }
            40% { transform: translateX(9px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 123, 107, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255, 123, 107, 0); }
        }
        @keyframes successPop {
            0% { transform: scale(0.6); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes drawCheck {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }

        .anim-fade { animation: fadeIn 0.4s ease-out forwards; }
        .anim-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-pop { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .progress-bar { transition: width 1s linear; }

        .otc-badge { position: absolute; top: 10px; right: 10px; background: rgba(255, 123, 107, 0.9); color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; z-index: 10; letter-spacing: 0.5px; pointer-events: none; }
        .cursor-blink::after { content: '|'; animation: blink 1s step-end infinite; color: white; }
        .delay-btn { opacity: 0; animation: showBtn 0.5s ease-out 3.5s forwards; }
        .chart-canvas { width: 100%; height: 170px; display: block; background: #121214; }
        .safe-top { padding-top: max(1.5rem, env(safe-area-inset-top)); }
        .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

        .verify-card { position: relative; border-radius: 28px; padding: 2px; overflow: hidden; }
        .verify-card::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, transparent 0deg, #FF7B6B 60deg, transparent 120deg, transparent 180deg, #4285F4 240deg, transparent 300deg, transparent 360deg);
            animation: rotateGradient 4s linear infinite;
        }
        .verify-card-inner {
            position: relative;
            border-radius: 26px;
            background: linear-gradient(180deg, #131316 0%, #0c0c0e 100%);
            z-index: 1;
        }
        .verify-card.error .verify-card-inner { animation: shake 0.4s ease-in-out; }
        .otp-input {
            background: #0a0a0c;
            border: 1.5px solid #27272a;
            border-radius: 14px;
            color: white;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            width: 100%;
            aspect-ratio: 1 / 1.15;
            outline: none;
            transition: all 0.2s ease;
            caret-color: #FF7B6B;
        }
        .otp-input:focus {
            border-color: #FF7B6B;
            box-shadow: 0 0 0 3px rgba(255, 123, 107, 0.15);
            background: #111114;
        }
        .otp-input.filled {
            border-color: rgba(255, 123, 107, 0.4);
            background: rgba(255, 123, 107, 0.06);
        }
        .otp-input.success {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .otp-input.errored {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const TRANSLATIONS = {
            ru: {
                welcomeTitle: "Добро пожаловать в будущее трейдинга.",
                welcomeSubtitle: "Искусственный интеллект проанализирует рынок за вас. Выбирайте актив, устанавливайте время экспирации и получайте точные сигналы.",
                btnStart: "Начать работу",
                selectLang: "Выберите язык",
                home: "ГЛАВНАЯ",
                chat: "AI ЧАТ",
                confidence: "Уверенность",
                marketStructure: "Структура рынка",
                confirmation: "Подтверждение",
                analyzing: "Сканирование графика",
                until: "до",
                left: "осталось",
                dashboard: "Дашборд",
                balance: "Баланс счета",
                recentSignals: "Последние сигналы",
                expired: "Истёк",
                chatHint: "Выберите инструмент, рынок и экспирацию — затем нажмите отправить.",
                clearChat: "Очистить чат",
                toSignals: "Перейти к AI сигналам",
                verifyTitle: "Верификация доступа",
                verifySubtitle: "Введите код подтверждения, чтобы получить AI-сигнал",
                verifyBtn: "Подтвердить",
                verifyChecking: "Проверка...",
                verifyCheckingMsg: "Проверка кода...",
                verifySuccessTitle: "Доступ разрешён",
                verifySuccessSub: "Код подтверждён. Получаем сигнал...",
                verifyErrorTitle: "Неверный код",
                verifyErrorSub: "Проверьте код и попробуйте снова",
                verifyCancel: "Отмена",
                verifySecured: "Защищено · Copy AL Security"
            },
            en: {
                welcomeTitle: "Welcome to the future of trading.",
                welcomeSubtitle: "AI will analyze the market for you. Choose an asset, set expiration time, and get accurate signals.",
                btnStart: "Get Started",
                selectLang: "Select Language",
                home: "HOME",
                chat: "AI CHAT",
                confidence: "Confidence",
                marketStructure: "Market structure",
                confirmation: "Confirmation",
                analyzing: "Scanning chart",
                until: "until",
                left: "left",
                dashboard: "Dashboard",
                balance: "Account Balance",
                recentSignals: "Recent Signals",
                expired: "Expired",
                chatHint: "Set the instrument, market and expiration — then tap send to get a signal.",
                clearChat: "Clear chat",
                toSignals: "Go to AI signals",
                verifyTitle: "Access Verification",
                verifySubtitle: "Enter the confirmation code to receive an AI signal",
                verifyBtn: "Confirm",
                verifyChecking: "Checking...",
                verifyCheckingMsg: "Verifying code...",
                verifySuccessTitle: "Access granted",
                verifySuccessSub: "Code confirmed. Generating signal...",
                verifyErrorTitle: "Invalid code",
                verifyErrorSub: "Check the code and try again",
                verifyCancel: "Cancel",
                verifySecured: "Secured · Copy AL Security"
            }
        };

        const SECRET_CODE = "23912";
        const STORAGE_KEY = "copyal_verified_code";

        // ================== УНИВЕРСАЛЬНОЕ СОХРАНЕНИЕ ==================
        // Работает через 3 независимых канала: localStorage + cookie + URL hash.
        // Если хоть один живой — код больше не спросится.

        const getCookie = (name) => {
            try {
                const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
                return m ? decodeURIComponent(m[1]) : null;
            } catch (e) { return null; }
        };

        const setCookie = (name, value, days = 365) => {
            try {
                const d = new Date(Date.now() + days * 864e5);
                document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
                return document.cookie.indexOf(name + '=') !== -1;
            } catch (e) { return false; }
        };

        const getHashCode = () => {
            try {
                const m = (window.location.hash || '').match(/[#&]v=([0-9]+)/);
                return m ? m[1] : null;
            } catch (e) { return null; }
        };

        const setHashCode = (code) => {
            try {
                const base = window.location.href.split('#')[0];
                window.history.replaceState(null, '', base + '#v=' + code);
                return true;
            } catch (e) { return false; }
        };

        const isVerifiedNow = () => {
            let ls = null;
            try { ls = localStorage.getItem(STORAGE_KEY); } catch (e) {}
            if (ls === SECRET_CODE) return true;
            if (getCookie(STORAGE_KEY) === SECRET_CODE) return true;
            if (getHashCode() === SECRET_CODE) return true;
            return false;
        };

        const persistVerified = (code) => {
            try { localStorage.setItem(STORAGE_KEY, code); } catch (e) {}
            setCookie(STORAGE_KEY, code);
            setHashCode(code); // страховка — переживает F5 даже на file://
        };

        const resetVerified = () => {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            try { document.cookie = `${STORAGE_KEY}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`; } catch (e) {}
            try {
                const base = window.location.href.split('#')[0];
                window.history.replaceState(null, '', base);
            } catch (e) {}
        };
        window.__copyalReset = () => { resetVerified(); location.reload(); };
        // ==============================================================

        const Icon = ({ path, size = 20, stroke = 2, fill = "none" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{path}</svg>
        );
        const Icons = {
            Globe: () => <Icon path={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>} size={18} />,
            Chat: () => <Icon path={<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>} size={18} />,
            Home: () => <Icon path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Send: () => <Icon path={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} size={16} />,
            Refresh: () => <Icon path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} size={18} />,
            TrendUp: () => <Icon path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} size={20} />,
            TrendDown: () => <Icon path={<><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></>} size={20} />,
            Lock: () => <Icon path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} size={14} />,
            Chevron: () => <Icon path={<polyline points="6 9 12 15 18 9"/>} size={14} />,
            Check: () => <Icon path={<polyline points="20 6 9 17 4 12"/>} size={14} />,
            Sparkles: ({ size = 32 }) => <Icon path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></>} size={size} />,
            Wallet: () => <Icon path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} size={20} />,
            Activity: () => <Icon path={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>} size={20} />,
            Trash: () => <Icon path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} size={16} />,
            X: () => <Icon path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} size={18} />,
            Shield: ({ size = 24 }) => <Icon path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} size={size} />
        };

        const ClaudeIcon = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round">
                <line x1="12" y1="3" x2="12" y2="21" />
                <line x1="4" y1="7.5" x2="20" y2="16.5" />
                <line x1="4" y1="16.5" x2="20" y2="7.5" />
            </svg>
        );
        const GptIcon = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round">
                <ellipse cx="12" cy="12" rx="9.5" ry="4" />
                <ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(60 12 12)" />
                <ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(120 12 12)" />
                <circle cx="12" cy="12" r="1.4" fill={color} stroke="none" />
            </svg>
        );
        const GeminiIcon = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={color}>
                <path d="M12 2c.3 0 .55.2.63.5.5 2.8 1.5 4.8 3.3 6.6 1.8 1.8 3.8 2.8 6.6 3.3.3.08.5.33.5.63s-.2.55-.5.63c-2.8.5-4.8 1.5-6.6 3.3-1.8 1.8-2.8 3.8-3.3 6.6-.08.3-.33.5-.63.5s-.55-.2-.63-.5c-.5-2.8-1.5-4.8-3.3-6.6-1.8-1.8-3.8-2.8-6.6-3.3-.3-.08-.5-.33-.5-.63s.2-.55.5-.63c2.8-.5 4.8-1.5 6.6-3.3 1.8-1.8 2.8-3.8 3.3-6.6.08-.3.33-.5.63-.5z"/>
            </svg>
        );

        const AI_MODELS = [
            { id: 'claude', name: 'Claude Sonnet 5', hex: '#FF7B6B', Icon: ClaudeIcon },
            { id: 'gpt', name: 'GPT-5 mini', hex: '#10a37f', Icon: GptIcon },
            { id: 'gemini', name: 'Gemini Pro', hex: '#4285F4', Icon: GeminiIcon }
        ];

        const FOREX_PAIRS = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'AUD/USD', 'USD/CAD', 'USD/CHF', 'NZD/USD', 'EUR/GBP', 'EUR/JPY', 'GBP/JPY', 'AUD/JPY', 'EUR/AUD', 'EUR/CAD', 'GBP/AUD', 'USD/MXN', 'USD/ZAR', 'USD/TRY', 'USD/SEK', 'USD/NOK', 'USD/DKK'];
        const OTC_PAIRS = FOREX_PAIRS.map(p => `${p} OTC`);
        const CRYPTO_PAIRS = ['BTC/USD', 'ETH/USD', 'SOL/USD', 'XRP/USD'];
        const ALL_ASSETS = [...FOREX_PAIRS, ...CRYPTO_PAIRS, ...OTC_PAIRS];
        const TIMEFRAMES = ['5s', '10s', '15s', '30s', '1m', '5m'];
        const getSeconds = (tf) => tf.includes('m') ? parseInt(tf) * 60 : parseInt(tf);

        const VerifyModal = ({ open, onClose, onSuccess, t, aiModel }) => {
            const [digits, setDigits] = useState(['', '', '', '', '']);
            const [status, setStatus] = useState('idle');
            const inputsRef = useRef([]);

            useEffect(() => {
                if (open) {
                    setDigits(['', '', '', '', '']);
                    setStatus('idle');
                    setTimeout(() => inputsRef.current[0]?.focus(), 250);
                }
            }, [open]);

            if (!open) return null;

            const code = digits.join('');

            const handleChange = (idx, val) => {
                if (status === 'checking' || status === 'success') return;
                const digit = val.replace(/\D/g, '').slice(-1);
                const next = [...digits];
                next[idx] = digit;
                setDigits(next);
                if (digit && idx < 4) inputsRef.current[idx + 1]?.focus();
                if (status === 'error') setStatus('idle');
            };

            const handleKeyDown = (idx, e) => {
                if (status === 'checking' || status === 'success') return;
                if (e.key === 'Backspace' && !digits[idx] && idx > 0) inputsRef.current[idx - 1]?.focus();
                if (e.key === 'ArrowLeft' && idx > 0) inputsRef.current[idx - 1]?.focus();
                if (e.key === 'ArrowRight' && idx < 4) inputsRef.current[idx + 1]?.focus();
                if (e.key === 'Enter' && code.length === 5) submit();
            };

            const handlePaste = (e) => {
                e.preventDefault();
                if (status === 'checking' || status === 'success') return;
                const text = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 5);
                if (!text) return;
                const next = ['', '', '', '', ''];
                for (let i = 0; i < text.length; i++) next[i] = text[i];
                setDigits(next);
                inputsRef.current[Math.min(text.length, 4)]?.focus();
            };

            const submit = () => {
                if (code.length !== 5 || status === 'checking' || status === 'success') return;
                setStatus('checking');
                setTimeout(() => {
                    if (code === SECRET_CODE) {
                        persistVerified(code);
                        setStatus('success');
                        setTimeout(() => { onSuccess(); }, 900);
                    } else {
                        setStatus('error');
                        setDigits(['', '', '', '', '']);
                        setTimeout(() => inputsRef.current[0]?.focus(), 400);
                    }
                }, 850);
            };

            const cardClass =
                status === 'error' ? 'verify-card error' :
                status === 'success' ? 'verify-card success' :
                'verify-card';

            return (
                <div
                    className="fixed inset-0 z-[300] flex items-center justify-center p-5 anim-fade"
                    style={{ background: 'radial-gradient(ellipse at center, rgba(9,9,11,0.85) 0%, rgba(0,0,0,0.95) 100%)', backdropFilter: 'blur(14px)', WebkitBackdropFilter: 'blur(14px)' }}
                    onClick={status === 'checking' || status === 'success' ? undefined : onClose}
                >
                    <div className={`${cardClass} w-full max-w-[380px] anim-pop`} onClick={e => e.stopPropagation()}>
                        <div className="verify-card-inner p-6">
                            {status !== 'success' && (
                                <button
                                    onClick={onClose}
                                    className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white flex items-center justify-center transition-all z-10"
                                    disabled={status === 'checking'}
                                >
                                    <Icons.X />
                                </button>
                            )}

                            <div className="flex justify-center mb-4">
                                <div
                                    className="relative w-16 h-16 rounded-2xl flex items-center justify-center border-2 transition-all duration-500"
                                    style={{
                                        backgroundColor: status === 'success' ? 'rgba(16,185,129,0.15)' : status === 'error' ? 'rgba(239,68,68,0.15)' : `${aiModel.hex}15`,
                                        borderColor: status === 'success' ? 'rgba(16,185,129,0.5)' : status === 'error' ? 'rgba(239,68,68,0.5)' : `${aiModel.hex}55`,
                                        animation: status === 'idle' ? 'glowPulse 2.5s ease-in-out infinite' : 'none'
                                    }}
                                >
                                    {status === 'success' ? (
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{ animation: 'successPop 0.5s ease-out' }}>
                                            <polyline points="20 6 9 17 4 12" style={{ strokeDasharray: 100, strokeDashoffset: 100, animation: 'drawCheck 0.5s ease-out 0.1s forwards' }} />
                                        </svg>
                                    ) : status === 'error' ? (
                                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2.5" strokeLinecap="round">
                                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                        </svg>
                                    ) : (
                                        <Icons.Shield size={28} />
                                    )}
                                </div>
                            </div>

                            <h2 className="text-center text-white font-bold text-[19px] mb-1.5 tracking-tight">
                                {status === 'success' ? t.verifySuccessTitle :
                                 status === 'error' ? t.verifyErrorTitle :
                                 t.verifyTitle}
                            </h2>
                            <p className="text-center text-[12px] text-gray-400 leading-relaxed mb-6 max-w-[280px] mx-auto">
                                {status === 'success' ? t.verifySuccessSub :
                                 status === 'error' ? t.verifyErrorSub :
                                 t.verifySubtitle}
                            </p>

                            <div className="flex gap-2 mb-6" style={{ padding: '0 4px' }}>
                                {digits.map((d, i) => (
                                    <input
                                        key={i}
                                        ref={el => inputsRef.current[i] = el}
                                        type="tel"
                                        inputMode="numeric"
                                        maxLength={1}
                                        value={d}
                                        onChange={e => handleChange(i, e.target.value)}
                                        onKeyDown={e => handleKeyDown(i, e)}
                                        onPaste={handlePaste}
                                        onFocus={e => e.target.select()}
                                        disabled={status === 'checking' || status === 'success'}
                                        className={`otp-input ${d ? 'filled' : ''} ${status === 'success' ? 'success' : ''} ${status === 'error' ? 'errored' : ''}`}
                                    />
                                ))}
                            </div>

                            <button
                                onClick={submit}
                                disabled={code.length !== 5 || status === 'checking' || status === 'success'}

        const Typewriter = ({ text, delay = 40 }) => {
            const [currentText, setCurrentText] = useState('');
            const [isDone, setIsDone] = useState(false);
            useEffect(() => {
                let i = 0;
                setCurrentText('');
                setIsDone(false);
                const timer = setInterval(() => {
                    setCurrentText(text.substring(0, i));
                    i++;
                    if (i > text.length) { clearInterval(timer); setIsDone(true); }
                }, delay);
                return () => clearInterval(timer);
            }, [text, delay]);
            return <span className={!isDone ? 'cursor-blink' : ''}>{currentText}</span>;
        };

        const CanvasChart = memo(({ symbol, isOtc }) => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const width = canvas.width = canvas.offsetWidth * 2;
                const height = canvas.height = canvas.offsetHeight * 2;
                ctx.scale(2, 2);
                const w = width / 2, h = height / 2;
                let seed = 0;
                for (let i = 0; i < symbol.length; i++) seed += symbol.charCodeAt(i);
                const random = () => { const x = Math.sin(seed++) * 10000; return x - Math.floor(x); };
                const candles = [];
                let price = 1.0 + random() * 0.5;
                const numCandles = 40;
                const candleWidth = w / numCandles - 2;
                for (let i = 0; i < numCandles; i++) {
                    const open = price;
                    const volatility = 0.01 + random() * 0.03;
                    const close = open + (random() - 0.5) * volatility * 2;
                    const high = Math.max(open, close) + random() * volatility;
                    const low = Math.min(open, close) - random() * volatility;
                    price = close;
                    candles.push({ open, close, high, low });
                }
                const maxPrice = Math.max(...candles.map(c => c.high));
                const minPrice = Math.min(...candles.map(c => c.low));
                const range = maxPrice - minPrice || 1;
                const padding = 20;
                const scaleY = (val) => h - padding - ((val - minPrice) / range) * (h - padding * 2);
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = '#27272a'; ctx.lineWidth = 0.5;
                for (let i = 0; i < 5; i++) {
                    const y = padding + (i / 4) * (h - padding * 2);
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                }
                candles.forEach((c, i) => {
                    const x = i * (candleWidth + 2) + 2;
                    const yHigh = scaleY(c.high), yLow = scaleY(c.low);
                    const yOpen = scaleY(c.open), yClose = scaleY(c.close);
                    const isGreen = c.close > c.open;
                    ctx.fillStyle = isGreen ? '#10a37f' : '#ef4444';
                    ctx.strokeStyle = isGreen ? '#10a37f' : '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(x + candleWidth / 2, yHigh);
                    ctx.lineTo(x + candleWidth / 2, yLow);
                    ctx.stroke();
                    const bodyHeight = Math.max(1, Math.abs(yClose - yOpen));
                    ctx.fillRect(x, Math.min(yOpen, yClose), candleWidth, bodyHeight);
                });
                const lastY = scaleY(candles[candles.length - 1].close);
                ctx.strokeStyle = '#FF7B6B';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, lastY); ctx.lineTo(w, lastY); ctx.stroke();
                ctx.setLineDash([]);
            }, [symbol, isOtc]);
            return (
                <div className="relative w-full rounded-[20px] overflow-hidden border border-[#27272a] bg-[#121214]">
                    {isOtc && <div className="otc-badge">OTC</div>}

            );
        });

                                            </div>

                                            <button onClick={() => setActiveTab('chat')} className="w-full py-4 bg-white text-black rounded-2xl font-bold text-sm mt-2 flex items-center justify-center gap-2 hover:bg-gray-200 transition-all active:scale-[0.98] anim-slide-up" style={{animationDelay: '0.2s'}}>
                                                <Icons.Sparkles size={16} /> {t.toSignals}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'chat' && (
                                    <div className="flex-1 flex flex-col overflow-hidden">
                                        <div className="flex-1 overflow-y-auto px-5 custom-scroll">
                                            <div className="pt-2 pb-3">
                                                <CanvasChart symbol={asset} isOtc={isOtcSelected} />
                                            </div>

                                            {messages.length === 0 && (
                                                <div className="flex flex-col items-center text-center gap-1 py-2 anim-slide-up">
                                                    <div className="w-[64px] h-[64px] rounded-[20px] flex items-center justify-center border shadow-lg transition-colors duration-500" style={{ backgroundColor: `${aiModel.hex}15`, borderColor: `${aiModel.hex}40` }}>
                                                        <CurrentModelIcon size={28} color={aiModel.hex} />
                                                    </div>
                                                    <h2 className="text-lg text-white mt-2 tracking-wide" style={{ fontFamily: "'Playfair Display', serif" }}>{aiModel.name}</h2>
                                                    <p className="text-[11px] text-gray-400 max-w-[260px] leading-relaxed">{t.chatHint}</p>
                                                </div>
                                            )}

                                            {messages.map(msg => (
                                                <SignalMessage key={msg.id} msg={msg} now={now} t={t} />
                                            ))}

                                            <div ref={chatEndRef} style={{height: 1}} />
                                        </div>

                                        <div className="shrink-0 px-4 pt-2 pb-1 bg-[#09090b] border-t border-[#27272a]/60">
                                            <div className="flex gap-2 mb-2">
                                                <CustomSelect value={asset} options={ALL_ASSETS} onChange={setAsset} icon={<span className="text-base">🇪🇺</span>} openUp={true} />
                                                <div className="w-[82px]"><CustomSelect value={market} options={['OTC', 'Real']} onChange={setMarket} openUp={true} /></div>
                                                <div className="w-[68px]"><CustomSelect value={timeframe} options={TIMEFRAMES} onChange={setTimeframe} align="right" openUp={true} /></div>
                                            </div>

                                            <div className="flex gap-2 items-center">
                                                <ModelMiniSelect model={aiModel} onChange={setAiModel} />

                                                <div className="flex-1 bg-[#121214] border border-[#27272a] rounded-[20px] py-1.5 pl-3 pr-1.5 flex items-center gap-2 min-w-0 focus-within:ring-1 focus-within:ring-white/10 transition-all">
                                                    <span className="text-[11px] text-gray-400 truncate flex-1 select-none">
                                                        {asset} · {timeframe}
                                                    </span>
                                                    <button
                                                        onClick={requestSignal}
                                                        disabled={isAnalyzing || cooldown > 0}
                                                        className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition-all duration-300 ${
                                                            cooldown > 0 ? 'bg-[#27272a] text-gray-500 cursor-not-allowed' :
                                                            isAnalyzing ? 'cursor-not-allowed opacity-50' :
                                                            'hover:scale-105 active:scale-95 cursor-pointer'
                                                        }`}
                                                        style={{
                                                            backgroundColor: cooldown > 0 ? '' : `${aiModel.hex}25`,
                                                            color: cooldown > 0 ? '' : aiModel.hex
                                                        }}
                                                    >
                                                        {isAnalyzing ? (
                                                            <div className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin" />
                                                        ) : cooldown > 0 ? (
                                                            <span className="text-[10px] font-bold">{cooldown}</span>
                                                        ) : (
                                                            <Icons.Send />
                                                        )}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="shrink-0 bg-[#09090b]/95 backdrop-blur-xl border-t border-[#27272a] px-6 pt-2.5 safe-bottom flex justify-around items-center z-40">
                                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1.5 pb-2 transition-all duration-300 cursor-pointer ${activeTab === 'home' ? 'text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                                    <Icons.Home />
                                    <span className="text-[10px] font-bold tracking-widest">{t.home}</span>
                                </button>
                                <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-1.5 pb-2 transition-all duration-300 cursor-pointer ${activeTab === 'chat' ? 'text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                                    <Icons.Chat />
                                    <span className="text-[10px] font-bold tracking-widest">{t.chat}</span>
                                </button>
                            </div>
                        </>
                    )}

                    <VerifyModal
                        open={verifyOpen}
                        onClose={() => setVerifyOpen(false)}
                        onSuccess={handleVerified}
                        t={t}
                        aiModel={aiModel}
                    />

                    {isAnalyzing && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-[250] flex flex-col items-center justify-center anim-fade">
                            <div className="relative w-20 h-20 mb-6">
                                <div className="absolute inset-0 border-2 border-white/10 rounded-full"></div>
                                <div className="absolute inset-0 border-2 border-transparent rounded-full animate-spin" style={{ borderTopColor: aiModel.hex, borderRightColor: aiModel.hex }}></div>
                                <div className="absolute inset-0 flex items-center justify-center animate-pulse">
                                    <CurrentModelIcon size={32} color={aiModel.hex} />
                                </div>
                            </div>
                            <div className="w-48 h-1.5 bg-[#27272a] rounded-full mt-4 overflow-hidden">
                                <div className="h-full transition-all duration-75 ease-linear" style={{ width: `${analysisProgress}%`, backgroundColor: aiModel.hex }}></div>
                            </div>
                            <p className="text-xs font-medium text-gray-400 tracking-wide mt-3">
                                {t.analyzing} {asset}... {Math.round(analysisProgress)}%
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
